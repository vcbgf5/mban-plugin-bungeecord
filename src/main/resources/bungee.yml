name: BanManager
main: com.dziubek.banmanager.BanManagerPlugin
version: 1.0.0
author: Dziubek
description: Zarzadzanie proxy BungeeCord. Bany - /mban /mbanip /munban /munbanip /mbanlist. Wyciszenia (prawdziwe, przez ChatEvent) - /mute /unmute /mutelist. Serwery - /shutdown (odliczanie + zamkniecie, domyslny powod "Prace techniczne") /startserver (otwiera z powrotem) /servers. Inne - /broadcast /alert /find /send /kick /whois /online (alias /list) /vanish /warn /warnings /clearchat /bmreload. Gracz z uprawnieniem LuckPerms "admin.wholeserver" ma dostep do WSZYSTKICH komend tego pluginu bez nadawania kazdego banmanager.* z osobna. Operatorzy proxy (ops.txt) tez maja dostep automatycznie - dla innych nadaj konkretne wezly (banmanager.ban, banmanager.unban, banmanager.banlist, banmanager.mute, banmanager.shutdown, banmanager.shutdown.bypass, banmanager.broadcast, banmanager.find, banmanager.send, banmanager.servers, banmanager.kick, banmanager.whois, banmanager.online, banmanager.vanish, banmanager.warn, banmanager.clearchat, banmanager.reload) albo po prostu "admin.wholeserver".
