# Serwer, na ktory probujemy przekierowac gracza zbanowanego per-serwer (zamiast wyrzucac go
# z calego proxy), jesli akurat tam jest w momencie nalozenia bana albo proby wejscia.
# Puste = wybierany automatycznie pierwszy dostepny serwer, na ktorym gracz nie ma bana.
fallback-server: ''

# Awaryjny transport dla banmanager:control (realny /vanish i /shutdown), gdy na docelowym
# serwerze nie ma ani jednego gracza - zwykly plugin messaging wymaga polaczenia gracza jako
# transportu, wiec bez niego np. /shutdown wydany na pustym serwerze nigdy by naprawde nie
# wylaczyl backendu. Wtedy proxy laczy sie wprost gniazdem TCP do BackendManagera na porcie
# gry danego serwera + control-port-offset. control-secret MUSI byc IDENTYCZNY jak w config.yml
# kazdego BackendManagera na backendach - inaczej polaczenie zostanie odrzucone.
control-port-offset: 2000
control-secret: 'zmien-to-haslo'

# Wlasne MOTD (opis serwera na liscie serwerow gracza) - 2 male linijki: gradientowa nazwa
# sieci, a pod nia rotujaca sie reklama z listy "ads" (co ad-rotate-seconds sekund pokazuje
# sie kolejna, ta sama dla wszystkich pingujacych w danym oknie czasu) - bez liczby graczy.
# Rozbicie graczy na kazdym z podanych serwerow proxy + suma pokazuje sie dopiero po najechaniu
# myszka na licznik graczy (tooltip). Klucze pod "servers" MUSZA byc dokladnie takie same jak
# nazwy serwerow w config.yml samego BungeeCorda/Waterfalla - wartosc to tylko ladna nazwa do
# wyswietlenia. Kolejnosc w tooltipie = kolejnosc wpisow ponizej.
motd:
  enabled: true
  network-name: 'VantaNet'
  ad-rotate-seconds: 4
  ads:
    - '§d§lTryb BoxPvP już wystartował!'
    - '§a§lEcoSMP już jest!'
    - '§b§lBoxPvP - nowe pety!'
  servers:
    ecosmp: 'EcoSMP'
    lobby: 'Lobby'
    boxpvp: 'BoxPvP'

# Przekierowanie po subdomenie: gracz laczacy sie np. przez "test.vantanet.pl" trafia od razu na
# serwer proxy o nazwie "test" (musi byc dokladnie taka nazwa serwera w config.yml samego
# BungeeCorda/Waterfalla), zamiast na domyslny serwer. Dziala tylko dla PIERWSZEGO polaczenia z
# proxy - pozniejsze /server dzialaja normalnie. WYMAGA, zeby DNS subdomeny (rekord A/CNAME,
# najlatwiej wildcard "*.vantanet.pl") wskazywal na TEN SAM adres IP co glowna domena proxy -
# to trzeba ustawic u dostawcy DNS, ten plugin tego nie zalatwia. base-domain puste = wylaczone.
subdomain-routing:
  enabled: true
  base-domain: 'vantanet.pl'
